<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#65B79F">
<meta name="color-scheme" content="light">
<title>Springis · Floristería y decoración de eventos en Valencia</title>
<meta name="description" content="No vendemos el lujo de las flores, regalamos emociones. Ramilletes, arreglos, flores en caja y decoración de eventos en Valencia. Pide fácil y paga a tasa euro BCV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Colores de la marca: turquesa (principal), verde (secundario), blanco y negro.
   Sin degradados. Títulos en «Anton»; textos en «Jost». */
:root{
  --turq:#65B79F;--turq-osc:#4FA088;--turq-claro:#9EC9B7;--verde:#265B3D;--verde-osc:#1B4430;
  --bg:#FFFFFF;--surface:#F3FAF7;--paper:#FFFFFF;--ink:#1D2420;--muted:#5E6A63;--line:#DCE7E1;
  --olive:var(--turq);--olive-dark:var(--turq-osc);--olive-soft:var(--turq-claro);--rose:var(--turq);--rose-soft:var(--turq-claro);--err:#A8322A;
  --t:"Anton",Impact,"Arial Narrow",sans-serif;--b:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--b);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
a{color:var(--verde)}
:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--t);font-weight:400;line-height:1.08;margin:0;letter-spacing:.01em}
.kick{font-size:.72rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:2px;background:var(--olive);color:var(--ink);padding:14px 24px;font-size:.78rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .2s}
.btn:hover{background:var(--olive-dark)}
.btn.claro{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.hero .btn:not(.claro){background:var(--ink);color:#fff}
.hero .btn:not(.claro):hover{background:#000}
.hero .kick{color:var(--ink)}
.btn.claro:hover{background:var(--ink);color:#fff}
.btn.blanco{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.btn.blanco:hover{background:#fff;color:var(--ink)}
.btn.ancho{width:100%}
.btn.chico{padding:10px 14px;font-size:.7rem}
.btn[disabled]{opacity:.55;cursor:wait}
.flecha{width:14px;height:14px}
.link{display:inline-flex;align-items:center;gap:8px;font-size:.7rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.link:hover{color:var(--ink)}

/* Franja de la tasa */
.tasa-bar{background:var(--turq);color:var(--ink);font-size:.74rem;letter-spacing:.08em;text-align:center;padding:7px 16px}
.tasa-bar b{font-weight:500;color:#fff}

/* Encabezado */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:76px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--ink)}
.logo svg{width:38px;height:44px;color:var(--olive);flex:none}
.logo img{height:56px;width:auto}
.logo b{display:block;font-family:var(--t);font-weight:500;font-size:1.9rem;line-height:1}
.logo small{display:block;font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.menu{display:flex;gap:30px;list-style:none;margin:0;padding:0}
.menu a{font-size:.86rem;color:var(--muted);text-decoration:none;padding:6px 0;border-bottom:1px solid transparent}
.menu a:hover,.menu a.on{color:var(--ink);border-bottom-color:var(--ink)}
.iconos{display:flex;gap:4px;justify-content:flex-end}
.ico{position:relative;width:42px;height:42px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink);border-radius:50%}
.ico:hover{background:var(--olive-soft)}
.ico svg{width:21px;height:21px}
.ico .n{position:absolute;top:3px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--olive);color:var(--ink);font-size:.66rem;font-weight:600;display:grid;place-items:center;padding:0 4px}
.solo-movil{display:none}
.menu-movil{display:none;border-top:1px solid var(--line);padding:8px 20px 14px}
.menu-movil a{display:block;padding:10px 0;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:.95rem}
.menu-movil.abierto{display:block}

/* Portada */
.hero{position:relative;min-height:min(78vh,640px);display:flex;align-items:center;overflow:hidden;background:var(--turq)}
.hero .fondo{position:absolute;inset:0}
.hero .fondo img{width:100%;height:100%;object-fit:cover}
/* Con foto: bloque turquesa con el texto a la izquierda y la foto completa a la derecha (sin oscurecer las caras) */
.hero.con-foto{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:stretch}
.hero.con-foto .fondo{position:relative;grid-column:2;grid-row:1;min-height:100%}
.hero.con-foto .fondo img{position:absolute;inset:0;object-position:50% 40%}
.hero.con-foto > .wrap{grid-column:1;grid-row:1;display:flex;align-items:center;max-width:none;padding-left:max(20px,calc((100vw - 1160px) / 2 + 20px));padding-right:40px}
.hero .dibujo{position:absolute;right:8%;top:6%;bottom:0;width:min(26vw,300px);color:#fff;opacity:.9}
.hero .dibujo svg,.historia .rama svg{width:100%;height:100%;display:block}
.hero .texto{position:relative;max-width:520px;padding:60px 0}
.hero h1{font-size:clamp(2.6rem,6.4vw,4.4rem)}
.hero p.sub{font-size:1.02rem;font-weight:300;margin:18px 0 30px;max-width:30em}
.hero .acc{display:flex;gap:12px;flex-wrap:wrap}

/* Secciones */
.bloque{padding:80px 0}
.centro{text-align:center}
.titulo{font-size:clamp(2rem,4.4vw,2.8rem)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:40px}
.cat{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit}
.cat .img{aspect-ratio:3/4;background:var(--olive-soft);overflow:hidden;display:grid;place-items:center;color:var(--olive)}
.cat .img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.cat:hover .img img{transform:scale(1.06)}
.cat .img .flor{width:32%;height:32%}
.cat h3{font-size:1.45rem;margin:16px 0 6px}

/* Catálogo */
.catalogo{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs-wrap{position:sticky;top:76px;z-index:15;background:var(--surface);padding:14px 0 12px;border-bottom:1px solid var(--line);margin-top:30px}
.tabs-fila{display:flex;gap:14px;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:8px 14px;font-size:.78rem;letter-spacing:.06em;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab[aria-current="true"]{background:var(--turq);border-color:var(--turq);color:var(--ink)}
.buscar{position:relative;width:260px;flex:none}
.buscar input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:9px 34px 9px 36px;font-size:.88rem;min-height:40px}
.buscar input:focus{outline:0;border-color:var(--olive)}
.buscar input::-webkit-search-cancel-button{display:none}
.buscar svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted)}
.buscar .limpiar{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:30px;height:30px;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.sec{padding-top:36px;scroll-margin-top:160px}
.sec > h3{font-size:1.75rem;margin:0 0 16px}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.prod{display:grid;grid-template-columns:1fr 120px;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:16px;cursor:pointer;text-align:left;width:100%;transition:border-color .2s,box-shadow .2s}
.prod:hover{border-color:#cfc7b8;box-shadow:0 8px 24px rgba(47,49,43,.06)}
.prod h4{font-family:var(--t);font-weight:400;font-size:1.25rem;line-height:1.15;margin:0 0 6px}
.prod .d{color:var(--muted);font-size:.86rem;font-weight:300;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.precio{font-weight:500;font-size:1rem}
.precio s{color:var(--muted);font-weight:300;font-size:.86rem;margin-right:6px}
.precio .bs{display:block;font-size:.76rem;font-weight:300;color:var(--muted)}
.precio.consulta{color:var(--verde);font-size:.86rem;letter-spacing:.04em}
.etq{display:inline-block;font-size:.62rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:2px 8px;margin:0 4px 8px 0;background:var(--turq);color:var(--verde-osc)}
.etq.verde{background:var(--turq-claro);color:var(--verde-osc)}
.ph{position:relative;width:120px;height:160px;overflow:hidden;background:var(--olive-soft);display:grid;place-items:center;color:var(--olive);border-radius:2px}
.ph img{width:100%;height:100%;object-fit:cover}
.flor{width:44%;height:44%;color:var(--turq)}
.mas{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;border:0;background:var(--turq);color:var(--ink);font-size:1.3rem;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;display:grid;place-items:center}
.paso{position:absolute;left:6px;right:6px;bottom:6px;display:flex;align-items:center;justify-content:space-between;background:var(--olive);color:var(--ink);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.paso button{border:0;background:none;color:var(--ink);width:32px;height:32px;font-size:1.15rem;cursor:pointer}
.paso b{font-weight:500;font-size:.92rem}
.vacio{text-align:center;color:var(--muted);padding:30px 10px}

/* Historia */
.historia{display:grid;grid-template-columns:1fr 1fr;min-height:520px;background:var(--turq-claro)}
.historia .foto{background:var(--turq-claro);display:grid;place-items:center;color:var(--olive);overflow:hidden}
.historia .foto img{width:100%;height:100%;object-fit:cover}
.historia .foto .flor{width:30%;height:30%;opacity:.9;color:var(--turq)}
.historia .tx{position:relative;padding:70px clamp(24px,6vw,90px);display:flex;flex-direction:column;justify-content:center;background:var(--surface)}
.historia h2{font-size:clamp(1.9rem,3.6vw,2.6rem);max-width:13em}
.historia p{color:var(--muted);font-weight:300;margin:16px 0 0;max-width:32em}
.historia .rama{position:absolute;right:28px;bottom:36px;width:84px;height:170px;color:var(--turq)}
.cifras{display:flex;gap:34px;flex-wrap:wrap;margin:28px 0 30px}
.cifras b{display:block;font-family:var(--t);font-size:2rem;font-weight:400;line-height:1;color:var(--verde)}
.cifras span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Franja de beneficios */
.franja{background:var(--turq-claro);color:var(--ink)}
.franja ul{list-style:none;margin:0 auto;padding:44px 20px;max-width:1080px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.franja li{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 18px;border-left:1px solid rgba(255,255,255,.7)}
.franja li:first-child{border-left:0}
.franja svg{width:28px;height:28px;margin:0 0 12px;color:var(--ink)}
.franja b{display:block;margin-bottom:4px;font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.franja small{font-size:.82rem;font-weight:400}

/* Eventos */
.tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:36px 0 32px}
.tipo{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:18px;color:inherit;text-align:left;cursor:pointer;transition:border-color .2s}
.tipo:hover{border-color:var(--olive)}
.tipo b{display:block;font-family:var(--t);font-size:1.25rem;font-weight:400;line-height:1.15}
.tipo small{display:block;color:var(--muted);font-size:.82rem;font-weight:300;margin-top:6px;line-height:1.4}
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 0 36px;padding:0;list-style:none;counter-reset:p;border-top:1px solid var(--line)}
.pasos li{counter-increment:p;padding:22px 22px 0 0}
.pasos li::before{content:"0" counter(p);display:block;font-family:var(--t);font-size:1.8rem;color:var(--turq-osc);margin-bottom:6px}
.pasos b{display:block;font-weight:500}
.pasos small{color:var(--muted);font-weight:300}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:0 0 30px}
.gal{position:relative;border:0;padding:0;overflow:hidden;aspect-ratio:1;background:var(--olive-soft);cursor:pointer;color:#fff}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal:hover img{transform:scale(1.04)}
.gal span{position:absolute;inset:auto 0 0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55));font-size:.8rem;letter-spacing:.06em;text-align:left}

/* Preguntas y contacto */
.faqs{max-width:760px;margin:30px auto 0}
.faq{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;padding:18px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;font-family:var(--t);font-size:1.25rem;font-weight:400}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--b);font-weight:400;color:var(--turq-osc)}
.faq[open] summary::after{content:"−"}
.faq p{margin:0 0 18px;color:var(--muted);font-weight:300}
.contacto{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:30px}
.contacto div{background:var(--paper);padding:22px}
.contacto b{display:block;font-size:.68rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.contacto a,.contacto span{color:var(--ink);text-decoration:none;font-size:.98rem}
.pie{background:var(--turq);color:var(--ink);font-size:.82rem;padding:40px 0;text-align:center}
.pie .logo{margin:0 auto 14px;justify-content:center;color:#fff;cursor:default}
.pie .logo img{height:90px}
.pie .logo svg{color:var(--turq)}
.pie .logo small{color:var(--ink)}

/* Barra flotante del pedido */
.barra{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,160%);z-index:30;width:min(540px,calc(100% - 24px));display:flex;align-items:center;gap:12px;border:0;border-radius:2px;background:var(--turq);color:var(--ink);padding:10px 10px 10px 18px;cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,.9,.3,1.15);font-size:.88rem;letter-spacing:.04em}
.barra.ver{transform:translate(-50%,0)}
.barra .c{border:1px solid rgba(29,36,32,.35);min-width:28px;height:28px;display:grid;place-items:center;font-size:.82rem;padding:0 6px}
.barra .t{margin-left:auto;background:#fff;color:var(--ink);padding:8px 16px;font-weight:500}

/* Pantallas de pedido y cotización */
.panel{max-width:660px;margin:0 auto;padding:40px 20px 120px}
.volver{border:0;background:none;padding:6px 0;margin:0 0 10px;cursor:pointer;color:var(--muted);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.panel h1{font-size:clamp(2.2rem,6vw,3rem);margin:0 0 8px}
.panel > p.sd{color:var(--muted);font-weight:300;margin:0 0 24px}
.caja{background:var(--paper);border:1px solid var(--line);padding:20px;margin:0 0 14px}
.caja h2{font-family:var(--b);font-size:.72rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.linea{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.linea:last-of-type{border-bottom:0}
.linea .ph{width:60px;height:80px}
.linea .ph .flor{width:50%;height:50%}
.linea b{font-family:var(--t);font-size:1.15rem;font-weight:400}
.linea small{color:var(--muted);font-weight:300}
.linea .paso{position:static;background:var(--turq-claro);color:var(--ink);box-shadow:none;width:104px}
.linea .paso button{color:var(--ink)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 0;border-top:1px solid var(--line);margin-top:4px}
.tot span:first-child{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.tot b{font-family:var(--t);font-size:1.7rem;font-weight:400}
.tot small{display:block;text-align:right;color:var(--muted);font-weight:300;font-size:.8rem}
.nota{color:var(--muted);font-size:.84rem;font-weight:300;margin:8px 0 0}
label{display:block;font-size:.84rem;font-weight:500;margin:16px 0 6px}
label small{font-weight:300;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:2px;padding:12px 14px;min-height:46px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--olive)}
textarea{resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{position:relative;margin:0;font-weight:400}
.op input{position:absolute;opacity:0;pointer-events:none}
.op span{display:inline-block;padding:10px 16px;background:var(--bg);border:1px solid var(--line);border-radius:2px;cursor:pointer;font-size:.9rem}
.op input:checked + span{background:var(--turq);border-color:var(--turq);color:var(--ink)}
.op input:focus-visible + span{outline:2px solid var(--olive);outline-offset:2px}
.monto{background:var(--olive-soft);padding:14px 16px;margin:14px 0 0}
.monto b{font-family:var(--t);font-size:1.6rem;font-weight:400;display:block;line-height:1.1}
.monto small{color:var(--muted);font-size:.82rem}
.datos{border:1px dashed var(--turq);padding:14px 16px;margin:12px 0 0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.datos pre{margin:0;font:inherit;font-size:.92rem;white-space:pre-wrap}
.err{color:var(--err);font-weight:500;min-height:1.4em;margin:8px 0}
.listo{text-align:center;padding-top:70px}
.listo .ok{width:72px;height:72px;border-radius:50%;background:var(--olive-soft);color:var(--olive);display:grid;place-items:center;margin:0 auto 18px}
.listo .ok svg{width:30px;height:30px}
.listo .num{font-family:var(--t);font-size:2.8rem;font-weight:400;color:var(--verde);margin:6px 0 12px}
.listo p{color:var(--muted);font-weight:300;max-width:30em;margin:0 auto 22px}
.listo .acc{display:flex;flex-direction:column;gap:10px;align-items:center}
.ref{display:flex;gap:10px;align-items:center;background:var(--olive-soft);padding:8px 12px;margin:0 0 6px}
.ref img{width:44px;height:44px;object-fit:cover}
.ref button{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--verde);font-weight:500}

/* Ficha del producto */
dialog.ficha{border:0;padding:0;margin:auto;width:min(520px,100%);max-width:100%;max-height:min(92vh,860px);border-radius:3px;background:var(--paper);color:var(--ink);overflow:hidden}
dialog.ficha::backdrop{background:rgba(15,30,22,.5)}
.ficha-in{position:relative;display:flex;flex-direction:column;max-height:inherit}
.fotos{position:relative;flex:none}
.car{display:flex;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:3/4;max-height:62vh;background:var(--surface)}
.car::-webkit-scrollbar{display:none}
.car > *{flex:none;width:100%;height:100%;scroll-snap-align:center;object-fit:contain}
.car .emo{display:grid;place-items:center;color:var(--olive)}
.car .emo .flor{width:36%;height:36%}
.puntos{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.puntos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}
.puntos i.on{background:#fff}
.cerrar{position:absolute;z-index:2;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.95);cursor:pointer;font-size:1.3rem;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ficha-tx{padding:20px 22px 8px;overflow-y:auto}
.ficha-tx h2{font-size:1.9rem;margin:0 0 8px}
.ficha-tx p{color:var(--muted);font-weight:300;margin:10px 0 0;white-space:pre-line}
.ficha-pie{display:flex;gap:10px;align-items:center;padding:14px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.ficha-pie .paso{position:static;background:var(--turq-claro);color:var(--ink);box-shadow:none;width:118px;flex:none}
.ficha-pie .paso button{color:var(--ink)}
.ficha-pie .btn{flex:1}

/* En pantallas anchas la ficha va en dos columnas: la foto ocupa su recuadro exacto (3:4), sin bandas ni recortes */
@media (min-width:761px){
  dialog.ficha{width:min(920px,94vw);max-height:min(88vh,820px)}
  .ficha-in{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .fotos{grid-row:1 / 3}
  .car{width:auto;height:min(88vh,820px);max-height:none;aspect-ratio:3/4}
  .ficha-tx{padding:56px 32px 16px;align-self:start}
  .ficha-tx h2{font-size:2.3rem}
  .ficha-pie{padding:16px 32px 22px}
}
/* ===== Movimiento ===== */
:root{--suave:cubic-bezier(.2,.7,.2,1)}
/* Aparición al bajar: solo se oculta si el navegador puede animar (clase .anim en <html>) */
.anim .rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--suave),transform .8s var(--suave);transition-delay:var(--d,0s)}
.anim .rv.in{opacity:1;transform:none}
.anim .rv.ya{transition:none}
.anim .cat.rv,.anim .prod.rv,.anim .gal.rv{transform:translateY(34px) scale(.98)}
.anim .cat.rv.in,.anim .prod.rv.in,.anim .gal.rv.in{transform:none}
/* Portada: entrada escalonada y la rama se dibuja sola */
.anim .hero .texto > *{animation:entra .9s var(--suave) both}
.anim .hero .texto > :nth-child(2){animation-delay:.12s}
.anim .hero .texto > :nth-child(3){animation-delay:.24s}
.anim .hero .texto > :nth-child(4){animation-delay:.36s}
.anim .hero .dibujo path{stroke-dasharray:420;stroke-dashoffset:420;animation:dibuja 2.6s .3s ease-out forwards}
.anim .hero .dibujo path:nth-child(n+2){animation-delay:.9s;animation-duration:1.8s}
.anim .quieto .hero .texto > *,.anim .quieto .hero .dibujo path{animation:none;stroke-dashoffset:0}
@keyframes entra{from{opacity:0;transform:translateY(30px)}}
@keyframes dibuja{to{stroke-dashoffset:0}}
.hero .dibujo{animation:mece 7s ease-in-out 3s infinite alternate;transform-origin:50% 100%}
@keyframes mece{to{transform:rotate(-2.5deg)}}
/* Cambio de pantalla (catálogo, pedido, cotización) */
#app.cambio{animation:aparece .5s var(--suave)}
@keyframes aparece{from{opacity:0;transform:translateY(12px)}}
/* Tarjetas y botones */
.prod{transition:border-color .3s,box-shadow .35s,transform .35s var(--suave)}
.prod:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(29,36,32,.10)}
.ph img{transition:transform .6s var(--suave)}
.prod:hover .ph img{transform:scale(1.06)}
.cat .img{transition:transform .45s var(--suave),box-shadow .45s}
.cat:hover .img{transform:translateY(-6px);box-shadow:0 18px 34px rgba(29,36,32,.12)}
.cat .link .flecha,.btn .flecha{transition:transform .3s var(--suave)}
.cat:hover .link .flecha,.btn:hover .flecha{transform:translateX(5px)}
.btn{transition:background .25s,color .25s,transform .2s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(29,36,32,.14)}
.btn:active{transform:translateY(0)}
.tipo{transition:border-color .25s,transform .3s var(--suave),box-shadow .3s}
.tipo:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(29,36,32,.08)}
.franja li svg{transition:transform .4s var(--suave)}
.franja li:hover svg{transform:translateY(-4px) scale(1.12)}
.tab{transition:background .25s,color .25s,border-color .25s}
.mas{transition:transform .2s}
.mas:hover{transform:scale(1.12)}
/* Encabezado: al bajar se vuelve translúcido (vidrio esmerilado) y más delgado para no estorbar */
.top{transition:background .45s,border-color .45s,backdrop-filter .45s,-webkit-backdrop-filter .45s}
.top-in,.logo img{transition:height .4s var(--suave)}
.top.sombra{background:rgba(255,255,255,.42);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom-color:rgba(255,255,255,.35)}
.top.sombra:hover,.top.sombra:focus-within{background:rgba(255,255,255,.9)}
.top.sombra .top-in{height:58px}
.top.sombra .logo img{height:40px}
.bajando .tabs-wrap{top:58px}
/* Al agregar al pedido */
.salta{animation:salta .45s var(--suave)}
@keyframes salta{40%{transform:scale(1.3)}}
.barra.pop{animation:barraPop .45s var(--suave)}
@keyframes barraPop{40%{transform:translate(-50%,-6px) scale(1.03)}}
/* Ficha del producto */
dialog.ficha[open]{animation:fichaAbre .4s var(--suave)}
dialog.ficha[open]::backdrop{animation:fondo .35s ease}
@keyframes fichaAbre{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes fondo{from{opacity:0}}
/* Preguntas frecuentes */
.faq[open] p{animation:aparece .4s var(--suave)}
.faq summary::after{transition:transform .3s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}.anim .rv{opacity:1;transform:none}}

@media (max-width:900px){
  .top-in{grid-template-columns:auto 1fr;height:68px}
  .menu{display:none}
  .solo-movil{display:grid}
  .tabs-wrap{top:68px}
  .top.sombra .top-in{height:54px}
  .top.sombra .logo img{height:38px}
  .bajando .tabs-wrap{top:54px}
  .cats{grid-template-columns:repeat(2,1fr);gap:16px}
  .historia{grid-template-columns:1fr}
  .historia .foto{aspect-ratio:4/3}
  .historia .rama{display:none}
  .franja ul{grid-template-columns:repeat(2,1fr);row-gap:22px}
  .franja li:nth-child(3){border-left:0}
  .contacto{grid-template-columns:1fr 1fr}
  .tabs-fila{flex-direction:column;align-items:stretch;gap:10px}
  .buscar{width:100%}
}
@media (max-width:600px){
  .bloque{padding:56px 0}
  .logo b{font-size:1.6rem}
  .logo small{font-size:.5rem;letter-spacing:.16em;white-space:nowrap}
  .logo svg{width:30px;height:36px}
  .hero{min-height:auto}
  .hero .texto{padding:56px 0 64px}
  .hero.con-foto{grid-template-columns:1fr}
  .hero.con-foto .fondo{grid-column:1;grid-row:1;aspect-ratio:16/10;min-height:0}
  .hero.con-foto > .wrap{grid-column:1;grid-row:2;padding:0 20px}
  .hero .dibujo{right:-40px;top:20%;width:180px;opacity:.2}
  .lista{grid-template-columns:1fr}
  .prod{grid-template-columns:1fr 100px;padding:14px}
  .ph{width:100px;height:133px}
  .pasos{grid-template-columns:1fr}
  .tipos{grid-template-columns:1fr 1fr}
  .tipo small{display:none}
  .galeria{grid-template-columns:repeat(2,1fr)}
  .contacto{grid-template-columns:1fr}
  dialog.ficha{margin:auto 0 0;width:100%;max-height:94vh}
  .car{max-height:64vh}
  .dos{grid-template-columns:1fr}
}

}

/* ===== Movimiento al bajar ===== */
const MOVIMIENTO = "IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches;
if (MOVIMIENTO) document.documentElement.classList.add("anim");
const REVELAR = ".bloque .kick, .titulo, .cat, .sec > h3, .prod, .historia .foto, .historia .tx > :not(.rama), .franja li, .tipo, .pasos li, .gal, .faq, .contacto > div, .panel > *";
const vista = MOVIMIENTO ? new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in"); vista.unobserve(e.target);
  e.target.querySelectorAll("[data-cuenta]").forEach(contar);
}), {rootMargin:"0px 0px -8% 0px", threshold:.08}) : null;
// instante = true: lo que ya está en pantalla aparece sin animar (redibujos por datos nuevos)
function revelar(instante){
  if (!vista) return;
  const grupos = new Map();
  document.querySelectorAll("#app " + REVELAR.split(", ").join(", #app ")).forEach(el => {
    if (el.classList.contains("rv")) return;
    const k = grupos.get(el.parentElement) || 0; grupos.set(el.parentElement, k + 1);
    el.style.setProperty("--d", ((k % 4) * 0.09).toFixed(2) + "s");
    el.classList.add("rv");
    if (instante && el.getBoundingClientRect().top < innerHeight){ el.classList.add("in", "ya"); return; }
    vista.observe(el);
  });
}
// Respaldo por si el observador no avisa: al bajar, muestra lo que ya está en pantalla
let revisando = false;
function revisarVisibles(){
  revisando = false;
  document.querySelectorAll(".rv:not(.in)").forEach(el => {
    if (el.getBoundingClientRect().top < innerHeight * 0.96){ el.classList.add("in"); if (vista) vista.unobserve(el); el.querySelectorAll("[data-cuenta]").forEach(contar); }
  });
}
if (MOVIMIENTO){
  addEventListener("scroll", () => { if (!revisando){ revisando = true; setTimeout(revisarVisibles, 120); } }, {passive:true});
  addEventListener("load", () => setTimeout(revisarVisibles, 1200));
}
// Cuenta de 0 al número (ej. +5.000 clientes)
function contar(el){
  const fin = +el.dataset.cuenta, pre = el.dataset.pre || "", t0 = performance.now(), dur = 1600;
  const paso = t => { const k = Math.min(1, (t - t0) / dur), v = Math.round(fin * (1 - Math.pow(1 - k, 3)));
    el.textContent = pre + v.toLocaleString("es-VE"); if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}
function actualizarBarra(){ $("#barra").classList.toggle("ver", cuenta() > 0 && ruta() === ""); }
let ultimaRuta = null;
window.addEventListener("hashchange", () => {
  const r = ruta(), antes = ultimaRuta; ultimaRuta = r;
  animarSiguiente = true;
  pintar();
  if (r === "" && destino){ const id = destino; destino = null; requestAnimationFrame(() => irA(id, true)); }
  else if (!(r === "" && antes === null)) window.scrollTo(0, 0);
});
function irA(id, sinAnim){
  cerrarMenu();
  if (ruta() !== ""){ destino = id; location.hash = ""; return; }
  if (id === "arriba") return window.scrollTo({top:0, behavior: sinAnim ? "auto" : "smooth"});
  const el = document.getElementById(id); if (!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY - ($("#top").offsetHeight + (id.startsWith("sec-") ? 64 : 0));
  window.scrollTo({top:y, behavior: sinAnim ? "auto" : "smooth"});
}
function cerrarMenu(){ $("#menuMovil").classList.remove("abierto"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
let espia = null;
function espiar(){
  if (espia) espia.disconnect();
  if (!("IntersectionObserver" in window)) return;
  espia = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) marcarTab(e.target.id); }), {rootMargin:"-200px 0px -60% 0px"});
  document.querySelectorAll("#zona [data-sec]").forEach(s => espia.observe(s));
}
function marcarTab(id){
  document.querySelectorAll(".tab").forEach(t => {
    const on = t.dataset.ir === id; t.setAttribute("aria-current", on);
    if (on){ const n = $("#tabs"); n.scrollTo({left: t.offsetLeft - n.clientWidth / 2 + t.clientWidth / 2, behavior:"smooth"}); }
  });
}

/* ===== Eventos de la página ===== */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-mas],[data-menos],[data-abrir],[data-ir],[data-tipo],[data-gal],[data-copiar],#limpiar,#quitarRef,#inicio,#cartBtn,#barra,#lupa,#menuBtn");
  if (!t) return;
  if (t.dataset.mas){ ev.stopPropagation(); cambiar(t.dataset.mas, 1); if ($("#ficha").open) $("#fPie").innerHTML = pieFicha(PRODUCTOS.find(p => p.id == t.dataset.mas)); return; }
  if (t.dataset.menos){ ev.stopPropagation(); cambiar(t.dataset.menos, -1); if ($("#ficha").open) $("#fPie").innerHTML = pieFicha(PRODUCTOS.find(p => p.id == t.dataset.menos)); return; }
  if (t.dataset.abrir) return abrirFicha(t.dataset.abrir);
  if (t.dataset.ir){ ev.preventDefault(); return irA(t.dataset.ir); }
  if (t.dataset.tipo){ q.tipo = t.dataset.tipo; location.hash = "cotizar"; return; }
  if (t.dataset.gal){ const p = PRODUCTOS.find(x => x.id == t.dataset.gal); q.ref = p.n; q.refImg = p.imgs[0] || ""; location.hash = "cotizar"; return; }
  if (t.dataset.copiar){ copiar(pago().datos + "\nMonto: " + (pago().enBs && CONFIG.tasa ? bs(aPagar()) : usd(aPagar())), t); return; }
  if (t.id === "limpiar"){ busqueda = ""; pintarZona(); $("#buscar").focus(); return; }
  if (t.id === "quitarRef"){ q.ref = ""; q.refImg = ""; pintar(); return; }
  if (t.id === "inicio"){ irA("arriba"); return; }
  if (t.id === "lupa"){ irA("catalogo"); setTimeout(() => { const b = $("#buscar"); if (b) b.focus({preventScroll:true}); }, 450); return; }
  if (t.id === "menuBtn"){ const m = $("#menuMovil"), ab = !m.classList.contains("abierto"); m.classList.toggle("abierto", ab); t.setAttribute("aria-expanded", ab); return; }
  if (t.id === "cartBtn" || t.id === "barra"){ location.hash = "carrito"; return; }
});
document.addEventListener("keydown", ev => {
  const t = ev.target.closest && ev.target.closest("[data-abrir]");
  if (t && (ev.key === "Enter" || ev.key === " ") && ev.target === t){ ev.preventDefault(); abrirFicha(t.dataset.abrir); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "buscar"){ busqueda = t.value; pintarZona(); return; }
  if (t.dataset.f){ f[t.dataset.f] = t.value; return; }
  if (t.dataset.q){ q[t.dataset.q] = t.value; return; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.name === "entrega"){ f.entrega = t.value; const y = window.scrollY; pintar(); window.scrollTo(0, y); }
  else if (t.name === "metodo" || t.name === "modo"){ f[t.name] = t.value; const y = window.scrollY; pintar(); window.scrollTo(0, y); }
  else if (t.name === "tipo") q.tipo = t.value;
  else if (t.name === "presupuesto") q.presupuesto = t.value;
  else if (t.name === "servicios") q.servicios = [...document.querySelectorAll('input[name="servicios"]:checked')].map(x => x.value);
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "formPedido") enviarPedido();
  if (ev.target.id === "formCot") enviarCot();
});
function pintarZona(){
  $("#zona").innerHTML = zona(); $("#tabs").innerHTML = tabs();
  const b = $(".buscar"), l = $("#limpiar");
  if (busqueda && !l) b.insertAdjacentHTML("beforeend", '<button class="limpiar" id="limpiar" aria-label="Borrar búsqueda">×</button>');
  if (!busqueda && l) l.remove();
  espiar();
}

window.addEventListener("scroll", () => {
  const b = window.scrollY > 60;
  $("#top").classList.toggle("sombra", b); document.documentElement.classList.toggle("bajando", b);
}, {passive:true});

/* ===== Tasa euro BCV ===== */
function pintarTasa(){
  if (!CONFIG.tasa) return;
  $("#tasaBar").innerHTML = `Tasa euro BCV${CONFIG.tasaFecha ? " del " + esc(CONFIG.tasaFecha) : ""}: <b>Bs. ${tasaTxt()}</b> · Delivery en Valencia`;
}
async function cargarTasa(){
  try {
    const r = await fetch("tasa.json?" + Date.now(), {cache:"no-store"});
    const j = await r.json();
    if (j.tasa > 0){ CONFIG.tasa = j.tasa; CONFIG.tasaFecha = (j.fecha || "").split("-").reverse().join("/"); }
  } catch (e) {}
  pintarTasa();
  if (CONFIG.tasa){ const y = window.scrollY; pintar(); window.scrollTo(0, y); }
}

/* ===== Datos desde Supabase ===== */
const desdeFila = r => {
  const precio = r.precio == null ? null : Number(r.precio), oferta = r.precio_oferta == null ? null : Number(r.precio_oferta);
  return {id:r.id, c:r.categoria, n:r.nombre, d:r.descripcion || "", p: oferta ?? precio, antes: oferta != null ? precio : null, imgs:r.imagenes || [], nuevo:r.nuevo};
};
if (conSB()){
  const g = lee("springis-productos", null), s = lee("springis-secciones", null);
  if (Array.isArray(g) && g.length) PRODUCTOS = g;
  if (Array.isArray(s) && s.length) CATS = s;
}
async function cargarProductos(){
  if (!conSB()) return;
  try {
    const pedir = async r => { const x = await fetch(SUPABASE.url + "/rest/v1/" + r, {headers:{apikey:SUPABASE.key}, cache:"no-store"}); if (!x.ok) throw new Error("HTTP " + x.status); return x.json(); };
    const [filas, secs] = await Promise.all([
      pedir("productos?select=id,categoria,nombre,descripcion,precio,precio_oferta,imagenes,nuevo&visible=eq.true&order=orden.asc,id.asc"),
      pedir("secciones?select=id,nombre&order=orden.asc,nombre.asc")
    ]);
    // Mientras no haya productos cargados en el panel, se siguen viendo los de ejemplo
    if (!filas.length) return;
    PRODUCTOS = filas.map(desdeFila);
    CATS = secs.map(x => ({id:x.id, n:x.nombre}));
    guarda("springis-productos", PRODUCTOS); guarda("springis-secciones", CATS);
    Object.keys(cart).forEach(id => { if (!PRODUCTOS.some(p => p.id == id && p.p != null)) delete cart[id]; });
    guarda("springis-cart", cart);
    if (ruta() === ""){ const y = window.scrollY; pintar(); window.scrollTo(0, y); }
    else if (ruta() === "carrito") pintar();
    actualizarCarrito();
  } catch (e){ console.warn("No se pudieron cargar los productos:", e.message); }
}

$("#inicio").innerHTML = logoHTML();
if (ruta() === "listo") history.replaceState(null, "", location.pathname);
ultimaRuta = ruta();
pintar(); actualizarCarrito();
cargarTasa();
cargarProductos();
</script>
